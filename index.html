<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DARUMA STREET</title>
    <meta name="description"
        content="DARUMA STREET Official Website | BMX Brand from Toyama, Japan.">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

    <!-- =========================
         LOADING
    ========================== -->

    <div id="loading">

        <div class="loading-logo">

            <!-- 後でSVGロゴに変更 -->
            <img src="assets/logo/logo.svg" alt="DARUMA STREET">

        </div>

        <div class="loading-bar">

            <span></span>

        </div>

    </div>



    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <a href="/" class="logo">

            <img src="assets/logo/logo.svg" alt="DARUMA STREET">

        </a>

        <button id="menuButton">

            MENU

        </button>

    </header>



    <!-- =========================
         HERO
    ========================== -->

    <section id="hero">

        <div class="hero-slider">

            <div class="slide active">

                <img src="assets/images/hero01.jpg" alt="DARUMA STREET">

            </div>

            <div class="slide">

                <img src="assets/images/hero02.jpg" alt="DARUMA STREET">

            </div>

            <div class="slide">

                <img src="assets/images/hero03.jpg" alt="DARUMA STREET">

            </div>

        </div>



        <!-- スライド番号 -->

        <div class="hero-counter">

            <span class="current">01</span>

            <span>02</span>

            <span>03</span>

        </div>

    </section>



    <!-- =========================
         MENU
    ========================== -->

    <nav id="menu">

        <ul>

            <li><a href="#">ABOUT</a></li>

            <li><a href="#">PRODUCTS</a></li>

            <li><a href="#">TEAM</a></li>

            <li><a href="#">NEWS</a></li>

            <li><a href="#">DEALERS</a></li>

            <li><a href="#">CONTACT</a></li>

        </ul>

    </nav>



    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
